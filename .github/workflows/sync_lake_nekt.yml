name: Lake -> Nekt

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia 06:00 BRT: incremental
    - cron: "0 8 * * 0"   # domingo 05:00 BRT: full refresh
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Reenviar as tabelas inteiras"
        type: boolean
        default: false
      tables:
        description: "Tabelas separadas por espaço (vazio = todas)"
        type: string
        default: ""

concurrency:
  group: lake-nekt
  cancel-in-progress: false   # nunca roda duas sincronizações ao mesmo tempo

jobs:
  sync:
    runs-on: ubuntu-24.04     # fixo, para não mudar sozinho com a migração do ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Listar arquivos do repositório
        run: git ls-files

      - name: Localizar o script
        id: script
        run: |
          # aceita qualquer combinação de maiúsculas/minúsculas e qualquer pasta
          SCRIPT=$(git ls-files | grep -iE '(^|/)sync_lake_nekt\.py$' | head -n 1)
          if [ -z "$SCRIPT" ]; then
            DUPLA=$(git ls-files | grep -iE 'sync_lake_nekt\.py\.[a-z]+$' | head -n 1)
            if [ -n "$DUPLA" ]; then
              echo "::error::Encontrei '$DUPLA'. A extensão está duplicada; renomeie para terminar só em .py."
            else
              echo "::error::Nenhum arquivo sync_lake_nekt.py no repositório. Veja a lista no passo 'Listar arquivos do repositório'."
            fi
            exit 1
          fi
          echo "Script encontrado em: $SCRIPT"
          echo "path=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: pip install "google-cloud-bigquery==3.25.0" "requests==2.32.3"

      - name: Gravar credencial do Google
        env:
          GCP_ADC_JSON: ${{ secrets.GCP_ADC_JSON }}
        run: |
          if [ -z "$GCP_ADC_JSON" ]; then
            echo "::error::Secret GCP_ADC_JSON não configurado no repositório."
            exit 1
          fi
          printf '%s' "$GCP_ADC_JSON" > "$RUNNER_TEMP/adc.json"

      - name: Sincronizar
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/adc.json
          BQ_BILLING_PROJECT: enduring-coda-490721-k1
          FULL_REFRESH: ${{ (github.event_name == 'schedule' && github.event.schedule == '0 8 * * 0') || inputs.full_refresh == true }}
          NEKT_WEBHOOK_API_KEY: ${{ secrets.NEKT_WEBHOOK_API_KEY }}
          NEKT_WEBHOOK_CUSTOMERS: ${{ secrets.NEKT_WEBHOOK_CUSTOMERS }}
          # adicione aqui um NEKT_WEBHOOK_<TABELA> para cada tabela nova
        run: python "${{ steps.script.outputs.path }}" ${{ inputs.tables }}

      - name: Apagar credencial
        if: always()
        run: rm -f "$RUNNER_TEMP/adc.json"
